# Every chart is linted and rendered with each of its ci/*-values.yaml scenarios, and the
# rendered manifests are validated against the Kubernetes API schema, so a template typo or an
# invalid field fails the PR instead of failing `helm upgrade` against a live cluster.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7

jobs:
  charts:
    name: Lint + render (k8s ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (Chart.yaml kubeVersion) and the version we run.
        kubernetes: ["1.30.0", "1.31.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint, render and validate every chart scenario
        env:
          KUBE_VERSION: ${{ matrix.kubernetes }}
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            echo "::group::helm lint ${chart}"
            helm lint "$chart" --strict
            echo "::endgroup::"
            for values in "$chart"ci/*-values.yaml; do
              echo "::group::render ${values}"
              helm lint "$chart" --strict -f "$values"
              # -strict rejects unknown fields; -summary prints a per-file result. The CRD catalog
              # covers ServiceMonitor / PrometheusRule (monitoring.coreos.com).
              helm template ci "$chart" -f "$values" --kube-version "$KUBE_VERSION" \
                | kubeconform -strict -summary -kubernetes-version "$KUBE_VERSION" \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done

      # Dashboards must parse, and take the data source from the $datasource variable so they work
      # on any Grafana, not only the one they were exported from. App and platform dashboards share
      # one Grafana, so a uid may only be used once. A platform dashboard that is not listed in the
      # kustomization would never reach Grafana.
      - name: Grafana dashboards
        run: |
          set -euo pipefail
          files=(charts/*/dashboards/*.json platform/kube-prometheus-stack/platform-monitoring/dashboards/*.json)
          for f in "${files[@]}"; do
            jq -e '.uid and .title' "$f" >/dev/null || { echo "::error file=$f::missing uid or title"; exit 1; }
            bad=$(jq -r '[.panels[] | select(.datasource.uid != "${datasource}") | .title] | join(", ")' "$f")
            if [ -n "$bad" ]; then echo "::error file=$f::hardcoded data source in: $bad"; exit 1; fi
            echo "ok: $f"
          done
          dup=$(jq -r '.uid' "${files[@]}" | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::dashboard uid used more than once: $dup"; exit 1; fi
          kdir=platform/kube-prometheus-stack/platform-monitoring
          for f in "$kdir"/dashboards/*.json; do
            grep -q "dashboards/$(basename "$f")" "$kdir/kustomization.yaml" \
              || { echo "::error file=$f::not listed in $kdir/kustomization.yaml"; exit 1; }
          done

      # Guard rails must keep failing: these renders are expected to be rejected.
      - name: Negative tests
        run: |
          set -uo pipefail
          chart=charts/inventory-api
          expect_fail() {
            if helm template ci "$chart" "$@" >/dev/null 2>&1; then
              echo "::error::expected failure but render succeeded: $*"; exit 1
            fi
            echo "rejected as expected: $*"
          }
          expect_fail --set image.tag=latest
          expect_fail --set ingress.enabled=true
          expect_fail --set serviceAccount.roleArn=not-an-arn
          expect_fail --set autoscaling.minReplicas=5 --set autoscaling.maxReplicas=3
          expect_fail --set metrics.serviceMonitor.path=metrics
          expect_fail --set metrics.prometheusRule.errorRatePercent=0
          expect_fail --set metrics.slo.enabled=true --set metrics.slo.objective=100
          expect_fail --set metrics.slo.enabled=true --set metrics.slo.objective=85

      # The rendered alert/recording rules, checked and unit-tested by Prometheus' own tool against
      # synthetic traffic: fast burn pages, slow burn only warns, in-budget is quiet, and a page
      # clears once the errors stop. Rules don't depend on the Kubernetes version, so run once.
      - name: Prometheus rules (promtool check + unit tests)
        if: matrix.kubernetes == '1.31.0'
        env:
          # The Prometheus version kube-prometheus-stack 65.1.1 deploys.
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v2.54.1
        run: |
          set -euo pipefail
          # Not mktemp -d: that is 0700, and promtool runs as nobody inside the container.
          work="$PWD/promtool-work"
          mkdir -p "$work"
          helm template ci charts/inventory-api -f charts/inventory-api/ci/production-values.yaml             | yq ea '[select(.kind == "PrometheusRule")] | {"groups": [.[].spec.groups[]]}' > "$work/rules.yaml"
          cp charts/inventory-api/ci/promtool/*-test.yaml "$work/"
          promtool() { docker run --rm -v "$work:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          promtool check rules rules.yaml
          for t in "$work"/*-test.yaml; do promtool test rules "$(basename "$t")"; done

  # Platform add-ons: the install script, every pinned chart rendered with our values, and our own
  # manifests validated against the Karpenter / External Secrets CRD schemas.
  platform:
    name: Platform add-ons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: shellcheck install.sh
        run: shellcheck platform/install.sh

      # Fails if a pinned chart version does not exist or a values key breaks a chart template.
      - name: Render every add-on (install.sh --dry-run)
        env:
          CLUSTER_NAME: ci-cluster
          AWS_REGION: us-east-1
          VPC_ID: vpc-0123456789abcdef0
          LBC_ROLE_ARN: arn:aws:iam::111122223333:role/ci-aws-lbc
          ESO_ROLE_ARN: arn:aws:iam::111122223333:role/ci-external-secrets
          KARPENTER_ROLE_ARN: arn:aws:iam::111122223333:role/ci-karpenter
          KARPENTER_QUEUE: ci-cluster-karpenter
        run: ./platform/install.sh --dry-run > rendered.yaml && grep -c '^kind:' rendered.yaml

      # The Alertmanager config the chart actually renders, checked by Alertmanager's own tool, plus
      # route tests so a reordered route can't silently send pages to the wrong place.
      - name: Alertmanager config and routes (amtool)
        env:
          ALERTMANAGER_IMAGE: quay.io/prometheus/alertmanager:v0.27.0
        run: |
          set -euo pipefail
          yq 'select(.kind == "Secret" and .metadata.name == "alertmanager-kube-prometheus-stack-alertmanager")
              | .data."alertmanager.yaml"' rendered.yaml | base64 -d > alertmanager.yaml
          amtool() { docker run --rm -v "$PWD:/w" -w /w --entrypoint amtool "$ALERTMANAGER_IMAGE" "$@"; }
          amtool check-config alertmanager.yaml
          route() {
            got=$(amtool config routes test --config.file=alertmanager.yaml "${@:2}")
            if [ "$got" != "$1" ]; then echo "::error::${*:2} -> $got, expected $1"; exit 1; fi
            echo "${*:2} -> $got"
          }
          route slack-critical alertname=InventoryApiHighErrorRate severity=critical
          route slack-warning alertname=InventoryApiCrashLooping severity=warning
          route slack-critical alertname=InventoryApiErrorBudgetFastBurn severity=critical slo=availability
          route slack-warning alertname=InventoryApiErrorBudgetSlowBurn severity=warning slo=availability
          route slack-warning alertname=NoSeverityLabel
          route null alertname=Watchdog severity=none
          route null alertname=CPUThrottlingHigh severity=info

      # Platform alerts unit-tested on synthetic metrics: stuck vs recovered ExternalSecret, controller
      # targets down or missing, EC2 errors per method, NodePool limit not double-counted across
      # the two Karpenter replicas.
      - name: Platform alert rules (promtool check + unit tests)
        env:
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v2.54.1
        run: |
          set -euo pipefail
          work="$PWD/promtool-work"
          mkdir -p "$work"
          yq '{"groups": .spec.groups}' platform/kube-prometheus-stack/platform-monitoring/platform-alerts.yaml > "$work/rules.yaml"
          cp platform/kube-prometheus-stack/tests/*-test.yaml "$work/"
          promtool() { docker run --rm -v "$work:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          promtool check rules rules.yaml
          for t in "$work"/*-test.yaml; do promtool test rules "$(basename "$t")"; done

      # platform-monitoring/ and kyverno/policies/ are kustomizations, so validate what kustomize
      # builds from them (the same objects Argo CD and install.sh apply), not the files on their own.
      - name: Validate platform manifests (CRD schemas)
        run: |
          set -euo pipefail
          kubectl kustomize platform/kube-prometheus-stack/platform-monitoring > platform-monitoring.yaml
          kubectl kustomize platform/kyverno/policies > kyverno-policies.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            platform/*/manifests/ platform-monitoring.yaml kyverno-policies.yaml

      # Every guardrail has a pass case and the case it exists to stop (kyverno test). Then the
      # inventory-api chart, rendered with its default and production values, must pass every
      # Enforce policy: the chart is the example the guardrails are written from. Audit-only rules
      # (image registries) only warn, since the default values use a placeholder image name.
      - name: Kyverno policies (unit tests + inventory-api chart)
        env:
          # The Kyverno version chart 3.4.6 deploys.
          KYVERNO_VERSION: v1.14.5
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin kyverno
          kyverno version
          # kyverno test skips a policy that fails its schema without saying so; make sure every
          # policy was loaded before trusting the results.
          expected=$(grep -c '^kind: ClusterPolicy' kyverno-policies.yaml)
          out=$(kyverno test platform/kyverno/tests 2>&1) && rc=0 || rc=$?
          echo "$out"
          grep -q "Applying ${expected} policies" <<<"$out" \
            || { echo "::error::kyverno test did not load all ${expected} policies (schema error?)"; exit 1; }
          [ "$rc" -eq 0 ]
          for scenario in default production; do
            helm template ci charts/inventory-api -f "charts/inventory-api/ci/${scenario}-values.yaml" > "chart-${scenario}.yaml"
            # Don't trust the exit code alone: require the summary line, so a crash also fails.
            out=$(kyverno apply kyverno-policies.yaml --resource "chart-${scenario}.yaml" --audit-warn 2>&1) || true
            echo "$out"
            if ! grep -q 'fail: 0,' <<<"$out" || ! grep -q 'error: 0,' <<<"$out"; then
              echo "::error::inventory-api (${scenario} values) breaks an enforced Kyverno policy"; exit 1
            fi
          done

  # GitOps: the Argo CD bootstrap, the Application/AppProject manifests, and a guard that the
  # Applications pin the same chart versions as install.sh (two install paths, one set of versions).
  gitops:
    name: GitOps (Argo CD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: shellcheck bootstrap.sh
        run: shellcheck gitops/bootstrap.sh

      - name: Render Argo CD (bootstrap.sh --dry-run)
        run: ./gitops/bootstrap.sh --dry-run > rendered.yaml && grep -c '^kind:' rendered.yaml

      - name: Validate Applications, AppProjects and repository secrets (CRD schemas)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/

      - name: Chart versions match install.sh / bootstrap.sh
        run: |
          set -euo pipefail
          pinned() { grep -E "^$1=" "$2" | cut -d= -f2; }
          app_rev() { grep -A1 "chart: $1\$" "gitops/apps/$2" | awk '/targetRevision:/ {print $2}'; }
          fail=0
          check() {
            if [ "$1" != "$2" ]; then echo "::error::$3: script pins $1, Application pins $2"; fail=1; fi
          }
          check "$(pinned METRICS_SERVER_CHART_VERSION platform/install.sh)" "$(app_rev metrics-server metrics-server.yaml)" metrics-server
          check "$(pinned LBC_CHART_VERSION platform/install.sh)" "$(app_rev aws-load-balancer-controller aws-load-balancer-controller.yaml)" aws-load-balancer-controller
          check "$(pinned ESO_CHART_VERSION platform/install.sh)" "$(app_rev external-secrets external-secrets.yaml)" external-secrets
          check "$(pinned KARPENTER_CHART_VERSION platform/install.sh)" "$(app_rev karpenter karpenter.yaml)" karpenter
          check "$(pinned KUBE_PROMETHEUS_STACK_CHART_VERSION platform/install.sh)" "$(app_rev kube-prometheus-stack kube-prometheus-stack.yaml)" kube-prometheus-stack
          check "$(pinned KYVERNO_CHART_VERSION platform/install.sh)" "$(app_rev kyverno kyverno.yaml)" kyverno
          check "$(pinned ARGOCD_CHART_VERSION gitops/bootstrap.sh)" "$(app_rev argo-cd argo-cd.yaml)" argo-cd
          exit $fail

  # Single required status check for branch protection.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [charts, platform, gitops]
    runs-on: ubuntu-latest
    steps:
      - name: All checks green
        run: |
          if [ "${{ needs.charts.result }}" != "success" ] || [ "${{ needs.platform.result }}" != "success" ] \
             || [ "${{ needs.gitops.result }}" != "success" ]; then
            echo "charts: ${{ needs.charts.result }}, platform: ${{ needs.platform.result }}, gitops: ${{ needs.gitops.result }}"
            exit 1
          fi
