# The Kubernetes "restricted" Pod Security Standard: non-root, no privilege escalation, all
# capabilities dropped, RuntimeDefault seccomp, no host namespaces/ports/paths. The inventory-api
# chart meets it by default; this makes it the rule for every app, not only that one.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted
  annotations:
    policies.kyverno.io/title: Pod Security Standards (restricted)
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Rejects pods that do not meet the restricted Pod Security Standard.
spec:
  background: true
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Enforce
        podSecurity:
          level: restricted
          # "latest" is the newest standard built into the Kyverno version we pin (chart 3.4.6),
          # so it only changes when that pin does, in a PR. A concrete version would be better,
          # but this CRD only accepts up to v1.29, and v1.31 is rejected at apply time.
          version: latest
