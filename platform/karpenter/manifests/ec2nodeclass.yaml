# How Karpenter launches EC2 instances: which AMI, subnets, security groups and disk. Subnets and
# security groups are found by the karpenter.sh/discovery tag the eks Terraform module sets, so
# no IDs live here. install.sh replaces example-cluster with CLUSTER_NAME.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Instance profile role name (not ARN) created next to the cluster.
  role: example-cluster-karpenter-node
  amiSelectorTerms:
    # Pin a dated AL2023 release in production and bump it on purpose; @latest is for sandboxes.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: example-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: example-cluster
  # IMDSv2 only, hop limit 1: pods can't reach the node's credentials, so apps must use IRSA.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    managed-by: karpenter
