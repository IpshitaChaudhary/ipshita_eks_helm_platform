# What kind of nodes Karpenter may add for general workloads, and how aggressively it removes them.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        workload: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Spot first, on-demand when Spot capacity is short. The chart's PDB and 2+ replicas keep
        # the app up when a Spot node is reclaimed.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      # Replace every node at least monthly so patched AMIs actually roll out.
      expireAfter: 720h
  # Hard ceiling: a runaway HPA or a bad deploy can't scale the bill without limit.
  limits:
    cpu: "64"
    memory: 256Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # Never take more than 10% of nodes away at once.
    budgets:
      - nodes: "10%"
