# One store for the whole cluster, authenticated with the operator's own ServiceAccount (IRSA).
# The IAM role behind it should allow secretsmanager:GetSecretValue only on the app/* prefix.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
