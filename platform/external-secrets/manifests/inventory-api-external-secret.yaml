# Creates the inventory-api-secrets Secret that charts/inventory-api reads with envFrom.
# Every key of the JSON secret app/inventory-api becomes one environment variable.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: inventory-api-secrets
  namespace: inventory-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: inventory-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: app/inventory-api
