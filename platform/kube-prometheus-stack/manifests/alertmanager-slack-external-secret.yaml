# Creates the alertmanager-slack Secret that Alertmanager mounts (alertmanager.alertmanagerSpec.secrets)
# and reads through slack_api_url_file. The JSON secret platform/alertmanager-slack in Secrets Manager
# holds the key webhook-url (a Slack incoming webhook).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: platform/alertmanager-slack
