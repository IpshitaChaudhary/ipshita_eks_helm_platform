# EKS only ships the old gp2 class. gp3 gives 3000 IOPS baseline at a lower price, and the
# Prometheus and Alertmanager volumes (values.yaml) request it by name.
# Requires the aws-ebs-csi-driver EKS add-on.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Create the volume in the AZ of the node the pod lands on, not a random one.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
