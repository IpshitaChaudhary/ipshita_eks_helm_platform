# Creates the grafana-admin Secret that kube-prometheus-stack's Grafana reads (grafana.admin.existingSecret).
# The JSON secret platform/grafana-admin in Secrets Manager holds the keys admin-user and admin-password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: platform/grafana-admin
