# promtool unit tests for platform-monitoring/platform-alerts.yaml. CI copies the rule groups
# out of the PrometheusRule into rules.yaml next to this file. Kept outside platform-monitoring/
# so Argo CD and kubeconform only see Kubernetes manifests there.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # One ExternalSecret stuck for 30m fires; one that recovered after 10m does not.
  - name: external secret not ready
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{job="external-secrets-metrics", namespace="inventory", name="inventory-api-secrets", condition="Ready", status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{job="external-secrets-metrics", namespace="inventory", name="flaky", condition="Ready", status="False"}'
        values: '1x10 0x20'
      - series: 'up{job="external-secrets-metrics"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: inventory
              name: inventory-api-secrets
            exp_annotations:
              summary: "ExternalSecret inventory/inventory-api-secrets has not synced for 15 minutes"
              description: "The Secret keeps its last synced values, but rotated credentials are not picked up and a Secret that was never created blocks new pods. Usually the IRSA role or a missing key in Secrets Manager: kubectl -n inventory describe externalsecret inventory-api-secrets"
      - eval_time: 20m
        alertname: ExternalSecretsControllerDown
        exp_alerts: []

  # The controller's target goes down at 5m; the alert fires once it has been down for 10m.
  - name: external secrets controller down
    interval: 1m
    input_series:
      - series: 'up{job="external-secrets-metrics"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExternalSecretsControllerDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalSecretsControllerDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The External Secrets controller has not been scraped for 10 minutes"
              description: "Existing Secrets stay as they are, but nothing is refreshed or created until the controller in namespace external-secrets is back."

  # No karpenter target at all (e.g. both replicas crash-looping) is as bad as up == 0.
  - name: karpenter down
    interval: 1m
    input_series:
      - series: 'up{job="some-other-job"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KarpenterControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Karpenter has not been scraped for 10 minutes"
              description: "No new nodes are launched, so pending pods stay pending, and Spot interruption notices are not acted on, so those nodes disappear without draining."

  # Steady InsufficientCapacity errors from EC2 Create; the healthy method stays quiet.
  - name: karpenter cloud provider errors
    interval: 1m
    input_series:
      - series: 'karpenter_cloudprovider_errors_total{job="karpenter", controller="nodeclaim.lifecycle", method="Create", provider="aws", error="InsufficientCapacityError"}'
        values: '0+1x40'
      - series: 'karpenter_cloudprovider_errors_total{job="karpenter", controller="nodeclaim.lifecycle", method="Delete", provider="aws", error="NodeClaimNotFoundError"}'
        values: '3x40'
      - series: 'up{job="karpenter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: KarpenterCloudProviderErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              method: Create
              error: InsufficientCapacityError
            exp_annotations:
              summary: "Karpenter EC2 calls failing: Create (InsufficientCapacityError)"
              description: "Often insufficient capacity for every allowed instance type, a service quota, or the node role / EC2NodeClass discovery tags. Check the karpenter logs in kube-system."
      - eval_time: 30m
        alertname: KarpenterControllerDown
        exp_alerts: []

  # Both controller replicas report the same gauges: 60 of 64 CPUs (94%) fires once, not twice;
  # a NodePool at 10 of 64 CPUs does not.
  - name: nodepool near its cpu limit
    interval: 1m
    input_series:
      - series: 'karpenter_nodepools_usage{job="karpenter", pod="karpenter-a", nodepool="default", resource_type="cpu"}'
        values: '60x30'
      - series: 'karpenter_nodepools_usage{job="karpenter", pod="karpenter-b", nodepool="default", resource_type="cpu"}'
        values: '60x30'
      - series: 'karpenter_nodepools_limit{job="karpenter", pod="karpenter-a", nodepool="default", resource_type="cpu"}'
        values: '64x30'
      - series: 'karpenter_nodepools_limit{job="karpenter", pod="karpenter-b", nodepool="default", resource_type="cpu"}'
        values: '64x30'
      - series: 'karpenter_nodepools_usage{job="karpenter", pod="karpenter-a", nodepool="batch", resource_type="cpu"}'
        values: '10x30'
      - series: 'karpenter_nodepools_limit{job="karpenter", pod="karpenter-a", nodepool="batch", resource_type="cpu"}'
        values: '64x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: KarpenterNodePoolNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              nodepool: default
              resource_type: cpu
            exp_annotations:
              summary: "NodePool default is above 90% of its CPU limit"
              description: "At the limit Karpenter stops launching nodes for this NodePool and new pods stay Pending. Raise spec.limits.cpu in karpenter/manifests/nodepool.yaml if the growth is expected."

  # The only admission controller target goes down at 6m and pages after 5m.
  - name: kyverno admission controller down
    interval: 1m
    input_series:
      - series: 'up{job="kyverno-svc-metrics", pod="kyverno-admission-controller-a"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: KyvernoAdmissionControllerDown
        exp_alerts: []
      - eval_time: 15m
        alertname: KyvernoAdmissionControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "No Kyverno admission controller has been up for 5 minutes"
              description: "App namespaces fail closed, so no pod can be created or changed there: deploys, HPA scale-out and replacements for evicted pods are all rejected. Platform namespaces are not affected. Check the pods in namespace kyverno."

  # One replica down while another still serves the webhook: no page.
  - name: kyverno one replica down
    interval: 1m
    input_series:
      - series: 'up{job="kyverno-svc-metrics", pod="kyverno-admission-controller-a"}'
        values: '0x20'
      - series: 'up{job="kyverno-svc-metrics", pod="kyverno-admission-controller-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KyvernoAdmissionControllerDown
        exp_alerts: []

  # A Docker Hub image keeps failing the Audit registry policy in inventory-api: warns while it
  # lasts. Enforce failures (a rejected deploy, which the deployer already sees) never warn, and the
  # violation in "legacy" that stopped at 10m is quiet again an hour later.
  - name: kyverno audit violations
    interval: 1m
    input_series:
      - series: 'kyverno_policy_results_total{job="kyverno-reports-controller-metrics", policy_name="restrict-image-registries", policy_validation_mode="audit", rule_name="ecr-only", rule_result="fail", resource_namespace="inventory-api"}'
        values: '0+1x120'
      - series: 'kyverno_policy_results_total{job="kyverno-svc-metrics", policy_name="disallow-latest-tag", policy_validation_mode="enforce", rule_name="disallow-latest", rule_result="fail", resource_namespace="inventory-api"}'
        values: '0+1x120'
      - series: 'kyverno_policy_results_total{job="kyverno-reports-controller-metrics", policy_name="restrict-image-registries", policy_validation_mode="audit", rule_name="ecr-only", rule_result="fail", resource_namespace="legacy"}'
        values: '0+1x10 10x110'
    alert_rule_test:
      - eval_time: 30m
        alertname: KyvernoAuditViolations
        exp_alerts:
          - exp_labels:
              severity: warning
              policy_name: restrict-image-registries
              resource_namespace: inventory-api
            exp_annotations:
              summary: "Kyverno policy restrict-image-registries reports violations in inventory-api"
              description: "Nothing is blocked yet (the policy is in Audit mode), but these workloads would be rejected once it is enforced: kubectl -n inventory-api get policyreport"
          - exp_labels:
              severity: warning
              policy_name: restrict-image-registries
              resource_namespace: legacy
            exp_annotations:
              summary: "Kyverno policy restrict-image-registries reports violations in legacy"
              description: "Nothing is blocked yet (the policy is in Audit mode), but these workloads would be rejected once it is enforced: kubectl -n legacy get policyreport"
      - eval_time: 115m
        alertname: KyvernoAuditViolations
        exp_alerts:
          - exp_labels:
              severity: warning
              policy_name: restrict-image-registries
              resource_namespace: inventory-api
            exp_annotations:
              summary: "Kyverno policy restrict-image-registries reports violations in inventory-api"
              description: "Nothing is blocked yet (the policy is in Audit mode), but these workloads would be rejected once it is enforced: kubectl -n inventory-api get policyreport"

  # The ExternalDNS target goes down at 6m and warns after 10m, not before.
  - name: external-dns down
    interval: 1m
    input_series:
      - series: 'up{job="external-dns", namespace="kube-system", pod="external-dns-a"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: ExternalDNSDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ExternalDNSDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "ExternalDNS has not been scraped for 10 minutes"
              description: "Existing records keep resolving, but a new or changed Ingress host gets no DNS record until ExternalDNS is back: kubectl -n kube-system get pods -l app.kubernetes.io/name=external-dns"

  # last_sync holds the time of the last good sync (here: the series value is the sample time, in
  # seconds). Syncs keep succeeding: quiet.
  - name: external-dns syncing
    interval: 1m
    input_series:
      - series: 'external_dns_controller_last_sync_timestamp_seconds{job="external-dns", pod="external-dns-a"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ExternalDNSSyncStale
        exp_alerts: []

  # Syncs stop at 5m (e.g. AccessDenied after an IAM change) while the pod stays up: stale from
  # 15m, warns 5 minutes later.
  - name: external-dns sync stale
    interval: 1m
    input_series:
      - series: 'external_dns_controller_last_sync_timestamp_seconds{job="external-dns", pod="external-dns-a"}'
        values: '0+60x5 300x25'
    alert_rule_test:
      - eval_time: 18m
        alertname: ExternalDNSSyncStale
        exp_alerts: []
      - eval_time: 25m
        alertname: ExternalDNSSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "ExternalDNS has not synced with Route53 for over 10 minutes"
              description: "DNS records no longer follow Ingress changes. The reason is in the logs, usually AccessDenied (IRSA role, see platform/external-dns/iam-policy.json) or throttling: kubectl -n kube-system logs deploy/external-dns"

  # A pod replaced at 6m (Recreate strategy): the old pod's series ends, the new one syncs. max()
  # follows the newest sync, so the replacement never looks stale.
  - name: external-dns pod replaced
    interval: 1m
    input_series:
      - series: 'external_dns_controller_last_sync_timestamp_seconds{job="external-dns", pod="external-dns-a"}'
        values: '0+60x5'
      - series: 'external_dns_controller_last_sync_timestamp_seconds{job="external-dns", pod="external-dns-b"}'
        values: '_x6 360+60x24'
    alert_rule_test:
      - eval_time: 25m
        alertname: ExternalDNSSyncStale
        exp_alerts: []

  # The application controller goes down at 5m; the server's target staying up does not help,
  # because only the controller syncs. Fires once it has been down for 10m.
  - name: argo cd controller down
    interval: 1m
    input_series:
      - series: 'up{job="argocd-application-controller-metrics", namespace="argocd", pod="argocd-application-controller-0"}'
        values: '1x5 0x20'
      - series: 'up{job="argocd-server-metrics", namespace="argocd", pod="argocd-server-a"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 14m
        alertname: ArgoCDControllerDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ArgoCDControllerDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The Argo CD application controller has not been scraped for 10 minutes"
              description: "Nothing is synced from Git until it is back: merged changes are not deployed and manual changes are not reverted. kubectl -n argocd get pods -l app.kubernetes.io/name=argocd-application-controller"

  # inventory-api stays OutOfSync (its sync keeps failing) and warns after 30m. karpenter is
  # OutOfSync for 10m while a sync runs, then Synced: its OutOfSync series goes stale, no alert.
  - name: argo cd app not synced
    interval: 1m
    input_series:
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="inventory-api", project="apps", sync_status="OutOfSync", health_status="Healthy"}'
        values: '1x40'
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="karpenter", project="platform", sync_status="OutOfSync", health_status="Healthy"}'
        values: '1x10'
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="karpenter", project="platform", sync_status="Synced", health_status="Healthy"}'
        values: '_x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDAppNotSynced
        exp_alerts: []
      - eval_time: 35m
        alertname: ArgoCDAppNotSynced
        exp_alerts:
          - exp_labels:
              severity: warning
              name: inventory-api
              project: apps
              sync_status: OutOfSync
            exp_annotations:
              summary: "Argo CD Application inventory-api (apps) has been OutOfSync for 30 minutes"
              description: "What is in Git is not what runs in the cluster. The sync error is in the Application status: kubectl -n argocd get application inventory-api -o jsonpath='{.status.operationState.message}'"

  # Unknown (the repo-server could not render the app) counts as not synced too.
  - name: argo cd app unknown
    interval: 1m
    input_series:
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="kyverno-policies", project="platform", sync_status="Unknown", health_status="Healthy"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: ArgoCDAppNotSynced
        exp_alerts:
          - exp_labels:
              severity: warning
              name: kyverno-policies
              project: platform
              sync_status: Unknown
            exp_annotations:
              summary: "Argo CD Application kyverno-policies (platform) has been Unknown for 30 minutes"
              description: "What is in Git is not what runs in the cluster. The sync error is in the Application status: kubectl -n argocd get application kyverno-policies -o jsonpath='{.status.operationState.message}'"

  # Degraded for 25m warns after 15m. Progressing (a rollout in flight) never does, and an app
  # that was Degraded for 5m and recovered stays quiet.
  - name: argo cd app unhealthy
    interval: 1m
    input_series:
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="inventory-api", project="apps", sync_status="Synced", health_status="Degraded"}'
        values: '1x25'
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="kube-prometheus-stack", project="platform", sync_status="Synced", health_status="Progressing"}'
        values: '1x25'
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="external-dns", project="platform", sync_status="Synced", health_status="Degraded"}'
        values: '1x5'
      - series: 'argocd_app_info{job="argocd-application-controller-metrics", namespace="argocd", name="external-dns", project="platform", sync_status="Synced", health_status="Healthy"}'
        values: '_x5 1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ArgoCDAppUnhealthy
        exp_alerts: []
      - eval_time: 20m
        alertname: ArgoCDAppUnhealthy
        exp_alerts:
          - exp_labels:
              severity: warning
              name: inventory-api
              project: apps
              health_status: Degraded
            exp_annotations:
              summary: "Argo CD Application inventory-api (apps) is Degraded"
              description: "The unhealthy resources are listed in the Application status: kubectl -n argocd get application inventory-api -o jsonpath='{.status.resources}'"
