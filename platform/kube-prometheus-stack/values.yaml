# Values for prometheus-community/kube-prometheus-stack: Prometheus Operator, Prometheus,
# Alertmanager, Grafana, node-exporter and kube-state-metrics.

# EKS runs the control plane for us: the scheduler, controller-manager and etcd are not
# reachable from inside the cluster, so scraping them only produces permanently-down targets
# and a "TargetDown" alert that can never be fixed. kube-proxy metrics bind to 127.0.0.1 on EKS.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PodMonitors/PrometheusRules from every namespace, not only the ones
    # carrying this release's labels, so app charts (charts/inventory-api) need no extra label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    retention: 15d
    # Stop before the volume fills: Prometheus drops the oldest blocks at this size.
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

alertmanager:
  # Routing: critical and warning go to separate Slack channels; Watchdog and InfoInhibitor are
  # plumbing alerts, not pages. The webhook URL is read from a file mounted from the
  # alertmanager-slack Secret (manifests/alertmanager-slack-external-secret.yaml), never stored here.
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
    route:
      receiver: slack-warning
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: slack-critical
          matchers:
            - severity = "critical"
          repeat_interval: 1h
        # Info alerts only feed the InfoInhibitor; nobody acts on them.
        - receiver: "null"
          matchers:
            - severity = "info"
    inhibit_rules:
      # A critical alert hides the warning for the same problem.
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [namespace, alertname]
      # Info alerts are muted while anything more serious fires in the namespace.
      - source_matchers: [alertname = "InfoInhibitor"]
        target_matchers: [severity = "info"]
        equal: [namespace]
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - channel: "#alerts-critical"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
      - name: slack-warning
        slack_configs:
          - channel: "#alerts-warning"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    templates:
      - /etc/alertmanager/config/*.tmpl

  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/ (see slack_api_url_file above).
    secrets: [alertmanager-slack]
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  # Admin login comes from the grafana-admin Secret that External Secrets creates
  # (manifests/grafana-admin-external-secret.yaml), never from values in Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards live in Git (ConfigMaps picked up by the sidecar); edits in the UI are not kept.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  persistence:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    hosts:
      - grafana.example.internal
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
