apiVersion: v2
name: inventory-api
description: Node.js inventory API on EKS - hardened Deployment, IRSA, ALB Ingress, HPA, PDB and NetworkPolicy
type: application
# Chart version: bump on every chart change (SemVer).
version: 0.3.0
# Default image tag when image.tag is not set. CI deploys pass the commit SHA instead.
appVersion: "1.0.0"
# 1.30+ for the native preStop "sleep" action (no shell needed in the image).
kubeVersion: ">=1.30.0-0"
keywords: [eks, nodejs, api]
home: https://github.com/IpshitaChaudhary/ipshita_eks_helm_platform
sources:
  - https://github.com/IpshitaChaudhary/jenkins-ci-cd-pipeline
maintainers:
  - name: Ipshita Chaudhary
