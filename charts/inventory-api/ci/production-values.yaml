# Everything on: IRSA, HTTPS ALB Ingress on a shared ALB, VPC-scoped NetworkPolicy, metrics + alerts.
image:
  repository: 111122223333.dkr.ecr.us-east-1.amazonaws.com/inventory-api
  tag: 3f9c2ab
serviceAccount:
  roleArn: arn:aws:iam::111122223333:role/inventory-api-irsa
envFrom:
  - secretRef:
      name: inventory-api-secrets
ingress:
  enabled: true
  host: inventory.example.com
  certificateArn: arn:aws:acm:us-east-1:111122223333:certificate/00000000-0000-0000-0000-000000000000
  groupName: shared-public
networkPolicy:
  allowFromNamespaces: [monitoring]
  allowFromCIDRs: [10.0.0.0/16]
autoscaling:
  maxReplicas: 10
metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  grafanaDashboard:
    enabled: true
  slo:
    enabled: true
