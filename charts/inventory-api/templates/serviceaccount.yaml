{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inventory-api.serviceAccountName" . }}
  labels:
    {{- include "inventory-api.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.roleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# Only mount a token when IRSA is in use: the AWS SDK needs it to call STS.
automountServiceAccountToken: {{ not (empty .Values.serviceAccount.roleArn) }}
{{- end }}
