{{- if .Values.metrics.serviceMonitor.enabled }}
# Tells the Prometheus Operator (platform/kube-prometheus-stack) to scrape the app through its Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "inventory-api.fullname" . }}
  labels:
    {{- include "inventory-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "inventory-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.serviceMonitor.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
