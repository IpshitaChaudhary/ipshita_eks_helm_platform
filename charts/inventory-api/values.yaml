# Default values for inventory-api.
# Defaults are production-safe; environments override only what differs (image tag, replicas, hostnames).

# Used only when autoscaling.enabled=false.
replicaCount: 2

image:
  # e.g. <account>.dkr.ecr.<region>.amazonaws.com/inventory-api
  repository: inventory-api
  # Defaults to .Chart.AppVersion. Pin to an immutable tag (commit SHA) in real deploys, never "latest".
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # A dedicated ServiceAccount per app, so IRSA permissions are scoped to this workload only.
  create: true
  name: ""
  # IRSA: set to the IAM role ARN this app may assume. Empty = no AWS access.
  roleArn: ""
  annotations: {}

# Port the container listens on (the app reads PORT).
containerPort: 3000

env: []
#  - name: LOG_LEVEL
#    value: info

# Pull all keys of existing Secrets/ConfigMaps in as env vars. The chart never creates Secrets:
# create them out of band (External Secrets / Secrets Manager), so no credential lives in Git.
envFrom: []
#  - secretRef:
#      name: inventory-api-secrets

service:
  type: ClusterIP
  port: 80

probes:
  path: /health
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit on purpose: avoids CFS throttling; the request still reserves capacity.
    memory: 128Mi

rollingUpdate:
  maxUnavailable: 0
  maxSurge: 1

# The app closes its listener on SIGTERM; keep this above the ALB deregistration delay.
terminationGracePeriodSeconds: 30
# Sleep before SIGTERM so the load balancer stops sending traffic first (avoids 502s on rollout).
preStopSleepSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Spread replicas across nodes and AZs. Set to [] to disable.
topologySpread:
  enabled: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # Scale down slowly so a brief dip doesn't remove capacity right before the next spike.
  scaleDownStabilizationSeconds: 300

podDisruptionBudget:
  enabled: true
  # Node drains and cluster upgrades may evict at most one replica at a time.
  maxUnavailable: 1

ingress:
  enabled: false
  # Requires the AWS Load Balancer Controller (see platform/).
  className: alb
  host: ""
  # ACM certificate ARN for HTTPS on the ALB.
  certificateArn: ""
  # Reuse one ALB across apps by giving them the same group name.
  groupName: ""
  scheme: internet-facing
  annotations: {}

# Prometheus scraping and alerts (needs platform/kube-prometheus-stack for the CRDs).
# The app must expose Prometheus metrics (e.g. prom-client's http_requests_total) on the http port.
# With networkPolicy on, add the Prometheus namespace to networkPolicy.allowFromNamespaces.
metrics:
  prometheusNamespace: monitoring
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    errorRatePercent: 5
    maxRestartsPer30m: 3
  # Grafana dashboard (dashboards/inventory-api.json) as a ConfigMap for the Grafana sidecar.
  # It has namespace/release pickers, so enable it on one release per cluster (fixed dashboard uid).
  grafanaDashboard:
    enabled: false
  # Availability SLO: share of requests over 30 days that must not return 5xx. Records the SLI
  # (5xx ratio) over the windows the multi-window burn-rate alerts need.
  slo:
    enabled: false
    objective: 99.9

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the app (matched on kubernetes.io/metadata.name).
  # With ALB "ip" targets, traffic arrives from the VPC, so also list the VPC CIDRs.
  allowFromNamespaces: []
  allowFromCIDRs: []
