# The operator and its CRDs. The ClusterSecretStore that uses those CRDs is a separate Application
# in a later wave (cluster-secret-store.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.7
      helm:
        valueFiles:
          - $values/platform/external-secrets/values.yaml
        valuesObject:
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/example-cluster-external-secrets
    - repoURL: https://github.com/IpshitaChaudhary/ipshita_eks_helm_platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are larger than the 256 KB client-side apply annotation allows.
      - ServerSideApply=true
