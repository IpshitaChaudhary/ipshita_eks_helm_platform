# What kube-prometheus-stack (wave -1) needs before it starts: the gp3 StorageClass for its volumes
# and the grafana-admin ExternalSecret. External Secrets' CRDs exist from wave -3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/IpshitaChaudhary/ipshita_eks_helm_platform.git
    targetRevision: main
    path: platform/kube-prometheus-stack/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
