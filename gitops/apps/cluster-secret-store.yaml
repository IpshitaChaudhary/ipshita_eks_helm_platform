# The cluster-wide Secrets Manager store, after the External Secrets CRDs exist (wave -3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/IpshitaChaudhary/ipshita_eks_helm_platform.git
    targetRevision: main
    path: platform/external-secrets/manifests
    directory:
      include: cluster-secret-store.yaml
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
