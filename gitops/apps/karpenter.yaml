# Karpenter controller and CRDs from the OCI registry (declared in gitops/repositories/). Its
# EC2NodeClass and NodePool follow in a later wave (karpenter-nodepools.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: public.ecr.aws/karpenter
      chart: karpenter
      targetRevision: 1.1.7
      helm:
        valueFiles:
          - $values/platform/karpenter/values.yaml
        valuesObject:
          settings:
            clusterName: example-cluster
            interruptionQueue: example-cluster-karpenter-interruptions
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/example-cluster-karpenter
    - repoURL: https://github.com/IpshitaChaudhary/ipshita_eks_helm_platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
